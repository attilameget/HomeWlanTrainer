<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>KICKR Pi Trainer</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">KICKR Pi</div>
      <div class="chips">
        <span id="chip-trainer" class="chip">Trainer …</span>
        <span id="chip-engine" class="chip">Idle</span>
      </div>
    </header>

    <main id="view-home" class="view">
      <section class="hero-card" id="today-card">
        <p class="eyebrow">Today</p>
        <h1 id="today-name">Demo Intervals</h1>
        <p id="today-meta" class="muted">Loading…</p>
        <button class="btn primary" id="btn-preview">Open workout</button>
      </section>
      <section>
        <h2>Library</h2>
        <ul id="library" class="list"></ul>
      </section>
      <nav class="bottom-nav">
        <button class="link" data-nav="settings">Settings</button>
      </nav>
    </main>

    <main id="view-preview" class="view hidden">
      <button class="link" data-nav="home">← Back</button>
      <h1 id="preview-name">Workout</h1>
      <p id="preview-meta" class="muted"></p>
      <ol id="preview-stages" class="stages"></ol>
      <button class="btn primary" id="btn-start">Start</button>
    </main>

    <main id="view-ride" class="view hidden">
      <p class="eyebrow" id="ride-stage-label">Stage</p>
      <div class="metrics">
        <div class="metric">
          <div class="label">Target</div>
          <div class="value" id="ride-target">—</div>
          <div class="unit">W</div>
        </div>
        <div class="metric">
          <div class="label">Actual</div>
          <div class="value" id="ride-power">—</div>
          <div class="unit">W</div>
        </div>
      </div>
      <div class="row">
        <div><span class="muted">Cadence</span> <strong id="ride-cadence">—</strong></div>
        <div><span class="muted">Stage</span> <strong id="ride-stage-left">—</strong></div>
        <div><span class="muted">Total</span> <strong id="ride-total-left">—</strong></div>
      </div>
      <p class="next" id="ride-next"></p>
      <div class="controls">
        <button class="btn" id="btn-pause">Pause</button>
        <button class="btn" id="btn-skip">Skip</button>
        <button class="btn" id="btn-prev">Prev</button>
        <button class="btn" id="btn-minus">−5%</button>
        <button class="btn" id="btn-plus">+5%</button>
        <button class="btn danger" id="btn-stop">Stop</button>
      </div>
      <p class="muted center" id="ride-intensity">Intensity 100%</p>
    </main>

    <main id="view-settings" class="view hidden">
      <button class="link" data-nav="home">← Back</button>
      <h1>Settings</h1>
      <label>FTP (W)<input id="set-ftp" type="number" min="50" max="500" /></label>
      <label>Trainer mode
        <select id="set-mode">
          <option value="simulated">Simulated</option>
          <option value="dircon">DirCon (KICKR Wi-Fi)</option>
        </select>
      </label>
      <label>Trainer host<input id="set-host" type="text" placeholder="optional IP" /></label>
      <label>Trainer port<input id="set-port" type="number" value="36866" /></label>
      <div class="controls">
        <button class="btn" id="btn-save">Save</button>
        <button class="btn" id="btn-discover">Discover</button>
        <button class="btn primary" id="btn-connect">Connect</button>
      </div>
      <pre id="discover-out" class="muted"></pre>
    </main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
