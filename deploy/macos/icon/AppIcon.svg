<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#163A5F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- track arc -->
  <circle cx="512" cy="520" r="280" fill="none" stroke="#7EB8D8" stroke-width="48" stroke-linecap="round"
          stroke-dasharray="520 1200" transform="rotate(-40 512 520)"/>
  <!-- power bar -->
  <rect x="360" y="420" width="90" height="280" rx="28" fill="#E8F1F8"/>
  <rect x="480" y="320" width="90" height="380" rx="28" fill="#5BA4C9"/>
  <rect x="600" y="480" width="90" height="220" rx="28" fill="#E8F1F8"/>
